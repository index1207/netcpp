name: windows

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

env:
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-11
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build `
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
                -DINCLUDE_TEST=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Google Test
        working-directory: ${{github.workspace}}/build/test/${{env.BUILD_TYPE}}
        run: ./googletest.exe