name: ubuntu

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

env:
  BUILD_TYPE: Release

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: "gcc-13",   cxx: "g++-13",     os: "ubuntu-latest" }
          - { cc: "clang-16", cxx: "clang++-16", os: "ubuntu-latest" }

    name: ${{ format('Ubuntu `{}`', matrix.compiler.cc) }}
    runs-on: ${{ matrix.compiler.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure clang
        run: |
          if [[ "${{ matrix.compiler.cc }}" == "clang"* ]]; then
            sudo apt update
            sudo apt install ${{ matrix.compiler.cc }} -y
          fi

      - name: Configure gcc
        run: |
          if [[ "${{ matrix.compiler.cc }}" == "gcc"* ]]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt update
            sudo apt install ${{ matrix.compiler.cxx }} -y
          fi

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Google Test
        working-directory: ${{github.workspace}}/build/test
        run: ./unittest
